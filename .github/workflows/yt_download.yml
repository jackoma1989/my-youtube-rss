name: YouTube Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube 视频或播放列表链接 (Video or Playlist URL)'
        required: true
        type: string
      resolution:
        description: '最高清晰度 (Max Resolution)'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - 'best'
          - 'audio_only'
      download_playlist:
        description: '是否下载整个播放列表 (Download entire playlist if URL has one)'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      playlist_items:
        description: '播放列表集数范围 (例如: all, 1-6, 1)。下载单集可填 1 或指定序号'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write

concurrency:
  group: yt-download
  cancel-in-progress: false

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (清理磁盘保证大文件下载空间)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Deno (JS Runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install -U --pre "yt-dlp[default]"

      - name: Download YouTube Video / Playlist
        id: download
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          DOWNLOAD_PLAYLIST: ${{ github.event.inputs.download_playlist }}
          PLAYLIST_ITEMS: ${{ github.event.inputs.playlist_items }}
        run: |
          mkdir -p output

          COOKIE_ARG=""
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf "%s\n" "$YOUTUBE_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
            echo "✅ 已启用项目配置的 YouTube Cookies 进行下载。"
          else
            echo "⚠️ 未检测到 YOUTUBE_COOKIES Secret，将尝试直接匿名下载。"
          fi

          if [ "$RESOLUTION" = "best" ]; then
            FORMAT="bestvideo+bestaudio/best"
          elif [ "$RESOLUTION" = "audio_only" ]; then
            FORMAT="bestaudio/best"
          else
            FORMAT="bestvideo[height<=$RESOLUTION]+bestaudio/best[height<=$RESOLUTION]"
          fi

          PLAYLIST_OPTS=""
          if [ "$DOWNLOAD_PLAYLIST" = "yes" ]; then
            PLAYLIST_OPTS="--yes-playlist"
            if [ -n "$PLAYLIST_ITEMS" ] && [ "$PLAYLIST_ITEMS" != "all" ]; then
              PLAYLIST_OPTS="$PLAYLIST_OPTS --playlist-items $PLAYLIST_ITEMS"
            fi
          else
            PLAYLIST_OPTS="--no-playlist"
          fi

          echo "🚀 开始下载: $VIDEO_URL"
          echo "画质: $RESOLUTION | 播放列表模式: $DOWNLOAD_PLAYLIST (范围: $PLAYLIST_ITEMS)"

          yt-dlp $COOKIE_ARG \
            $PLAYLIST_OPTS \
            -f "$FORMAT" \
            --merge-output-format mp4 \
            -o "output/%(playlist_index&{:02d} - |)s%(title)s.%(ext)s" \
            "$VIDEO_URL"

          COUNT=$(find output -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ 未检测到下载产物文件！"
            exit 1
          fi

          TAG_NAME="yt-$(date +%Y%m%d-%H%M%S)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "✅ 下载完成，共成功下载 $COUNT 个文件。"

      - name: Upload to GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.download.outputs.tag_name }}
          name: "YouTube Download: ${{ steps.download.outputs.tag_name }} (${{ steps.download.outputs.count }} files)"
          files: output/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Accelerated Download Links
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.download.outputs.tag_name }}
        run: |
          python3 - << 'EOF'
          import os
          import urllib.parse
          from pathlib import Path

          repo = os.environ.get("REPO", "")
          tag = os.environ.get("TAG", "")
          output_dir = Path("output")

          files = sorted([f for f in output_dir.iterdir() if f.is_file()])

          summary_lines = [
              "### 🎬 YouTube 视频下载已完成！",
              f"- **Release 标签**：`{tag}`",
              f"- **文件总数**：`{len(files)}` 个",
              "",
              "---",
              "#### 🚀 国内免翻墙直连高速下载（不消耗梯子流量，直接用浏览器或 IDM 下载）：",
              ""
          ]

          for i, f in enumerate(files, 1):
              raw_name = f.name
              size_mb = f.stat().st_size / (1024 * 1024)
              encoded_name = urllib.parse.quote(raw_name)
              original_url = f"https://github.com/{repo}/releases/download/{tag}/{encoded_name}"
              fast_url1 = f"https://ghproxy.link/{original_url}"
              fast_url2 = f"https://mirror.ghproxy.com/{original_url}"

              summary_lines.append(f"##### {i}. {raw_name} ({size_mb:.1f} MB)")
              summary_lines.append(f"- 🚀 **高速通道 1**: <{fast_url1}>")
              summary_lines.append(f"- 🚀 **高速通道 2**: <{fast_url2}>")
              summary_lines.append(f"- 🌐 **原始链接 (海外)**: <{original_url}>\n")

          full_content = "\n".join(summary_lines)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write(full_content)

          print("=" * 60)
          print(full_content)
          print("=" * 60)
          EOF
