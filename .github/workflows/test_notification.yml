name: Test Notification Channels

on:
  workflow_dispatch:
    description: 'Trigger a real-time connectivity test for Feishu, WeChat, and Telegram'

jobs:
  test-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Notification Connectivity Tests
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECHAT_BOT_TOKEN: ${{ secrets.WECHAT_BOT_TOKEN }}
          WECHAT_USER_ID: ${{ secrets.WECHAT_USER_ID }}
          WECHAT_CONTEXT_TOKEN: ${{ secrets.WECHAT_CONTEXT_TOKEN }}
          WECHAT_BASE_URL: ${{ vars.WECHAT_BASE_URL || secrets.WECHAT_BASE_URL || 'https://ilinkai.weixin.qq.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/test_notification.py
