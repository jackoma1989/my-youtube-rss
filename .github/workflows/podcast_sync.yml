name: YouTube to Podcast Sync

on:
  schedule:
    # Runs twice a day at 02:00 and 14:00 UTC (10:00 and 22:00 Beijing Time)
    - cron: '0 2,14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

concurrency:
  group: podcast-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U --pre "yt-dlp[default]"
          pip install -r requirements.txt

      - name: Run Podcast Sync
        env:
          YOUTUBE_CHANNEL_URL: ${{ secrets.YOUTUBE_CHANNEL_URL }}
          YOUTUBE_CHANNEL_URL_2: ${{ secrets.YOUTUBE_CHANNEL_URL_2 }}
          YOUTUBE_CHANNEL_URL_3: ${{ secrets.YOUTUBE_CHANNEL_URL_3 }}
          YOUTUBE_CHANNEL_URL_4: ${{ secrets.YOUTUBE_CHANNEL_URL_4 }}
          YOUTUBE_CHANNEL_URL_5: ${{ secrets.YOUTUBE_CHANNEL_URL_5 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MAX_EPISODES: ${{ vars.MAX_EPISODES || secrets.MAX_EPISODES || '15' }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python -m podcast_sync.main
